<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog – Catering Przy okazji!</title>
  <meta name="description" content="Wpis na blogu cateringu Przy okazji!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="wpis" data-title="Blog">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="/" class="brand">
        <span class="logo-mark logo-small"></span>
        <span class="brand-name" data-bind="name">Przy okazji!</span>
      </a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="/oferta/">Oferta</a>
        <a href="/#galeria">Galeria</a>
        <a href="/#o-mnie">O mnie</a>
        <a href="/blog/" class="active" aria-current="page">Blog</a>
        <a href="/#opinie">Opinie</a>
        <a href="#kontakt" class="btn btn-small">Zamów</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="section section-tight post" id="post">
      <div class="wrap post-wrap">
        <p class="post-back"><a href="/blog/">← Wszystkie wpisy</a></p>
        <p class="empty">Wczytywanie wpisu…</p>
      </div>
    </article>

    <div class="contact-strip">
      <div class="wrap contact-strip-inner" id="contact-strip"></div>
    </div>

    <section id="kontakt" class="section contact-section">
      <div class="wrap contact">
        <span class="logo-mark logo-contact"></span>
        <h2>Zamów catering</h2>
        <div class="divider"></div>
        <p class="contact-lead" data-bind="contactText">Napisz lub zadzwoń – podaj datę, liczbę gości i rodzaj okazji, a przygotuję dla Ciebie propozycję.</p>
        <ul class="contact-list" id="contact-list"></ul>
        <p class="script contact-script" data-bind="slogan"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">© <span id="year"></span> <span data-bind="name"></span> · <span data-bind="owner"></span></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
